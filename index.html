<body style="background: #d8c3a5"></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>

<script>
  /* global nn, handPoseDetection */

  let model, video, canvas
  let grooves = []
  let smoothX = null
  let smoothY = null
  let lastPinch = false
  let sandGrains = []

function drawRakeStroke (x1, y1, x2, y2) {
  const dx = x2 - x1
  const dy = y2 - y1
  const len = Math.sqrt(dx * dx + dy * dy)

  if (len < 2) return

  // perpendicular direction for rake teeth
  const nx = -dy / len
  const ny = dx / len

  const teeth = 5
  const spacing = 8

  for (let i = 0; i < teeth; i++) {
    const offset = (i - (teeth - 1) / 2) * spacing

    const ox = nx * offset
    const oy = ny * offset

    // highlight
    canvas.strokeStyle = 'rgba(255,255,255,0.16)'
    canvas.lineWidth = 3
    canvas.line(x1 + ox, y1 + oy - 1, x2 + ox, y2 + oy - 1)

    // main groove
    canvas.strokeStyle = 'rgba(110,85,55,0.35)'
    canvas.lineWidth = 2
    canvas.line(x1 + ox, y1 + oy, x2 + ox, y2 + oy)

    // shadow
    canvas.strokeStyle = 'rgba(70,50,35,0.18)'
    canvas.lineWidth = 1
    canvas.line(x1 + ox, y1 + oy + 1, x2 + ox, y2 + oy + 1)
  }
}

function drawGrooves () {
  for (let i = 1; i < grooves.length; i++) {
    const a = grooves[i - 1]
    const b = grooves[i]
    if (a === null || b === null) continue
    drawRakeStroke(a.x, a.y, b.x, b.y)
  }
}

  function drawSandBackground () {
    nn.get('body').css('background', '#d8c3a5')
    for (const grain of sandGrains) {
      canvas.fillStyle = 'rgba(80, 55, 30, 0.22)'
      canvas.circle(grain.x, grain.y, grain.r)
}
    }  
    
    // moss islands
    canvas.fillStyle = 'rgba(94, 125, 70, 0.5)'
    canvas.circle(canvas.width * 0.28, canvas.height * 0.22, 70)
    canvas.circle(canvas.width * 0.6, canvas.height * 0.15, 55)

    // stones
    canvas.fillStyle = 'rgba(95, 95, 95, 0.65)'
    canvas.circle(canvas.width * 0.18, canvas.height * 0.72, 45)
    canvas.circle(canvas.width * 0.78, canvas.height * 0.28, 60)
    canvas.circle(canvas.width * 0.68, canvas.height * 0.76, 35)
  
  function isOnObstacle (x, y) {
  const obstacles = [
    { x: canvas.width * 0.28, y: canvas.height * 0.22, r: 70 },
    { x: canvas.width * 0.6, y: canvas.height * 0.15, r: 55 },
    { x: canvas.width * 0.18, y: canvas.height * 0.72, r: 45 },
    { x: canvas.width * 0.78, y: canvas.height * 0.28, r: 60 },
    { x: canvas.width * 0.68, y: canvas.height * 0.76, r: 35 }
  ]

  return obstacles.some(o => nn.dist(x, y, o.x, o.y) < o.r + 12)
}
  
  async function update () {
    requestAnimationFrame(update)

    if (canvas.height !== video.height) {
      canvas.resize(video.width, video.height)
    }

    canvas.clear()
    drawSandBackground()

    // redraw saved grooves every frame
    drawGrooves()

    const opts = {
      flipHorizontal: true
    }
    const hands = await model.estimateHands(video, opts)

    if (hands.length > 0) {
      const hand = hands[0]
  const idx = hand.keypoints[8]
  const thb = hand.keypoints[4]

  const videoW = video.videoWidth || video.width
  const videoH = video.videoHeight || video.height

  const scaleX = canvas.width / videoW
  const scaleY = canvas.height / videoH

  const fingerX = idx.x * scaleX
  const fingerY = idx.y * scaleY

  const thumbX = thb.x * scaleX
  const thumbY = thb.y * scaleY

  if (smoothX === null) {
    smoothX = fingerX
    smoothY = fingerY
  } else {
    smoothX = smoothX * 0.75 + fingerX * 0.25
    smoothY = smoothY * 0.75 + fingerY * 0.25
  }

  if (isOnObstacle(smoothX, smoothY)) {
  grooves.push(null)
} else {
  grooves.push({ x: smoothX, y: smoothY })
}

  if (grooves.length > 500) {
    grooves.shift()
  }

  canvas.fillStyle = 'rgba(255,255,255,0.7)'
  canvas.circle(smoothX, smoothY, 8)

  canvas.fillStyle = 'rgba(255,255,255,0.35)'
  canvas.circle(thumbX, thumbY, 6)

  const d = nn.dist(fingerX, fingerY, thumbX, thumbY)
  const pinching = d < 35

  if (pinching && !lastPinch) {
    grooves = []
  }

  lastPinch = pinching
    }}

  async function setup () {
    video = nn.create('video')
      .addTo('body')
      .position(0, 0)
      .css({
        width: '100vw',
        height: '100vh',
        objectFit: 'cover',
        opacity: 0.15
      })
      .scale(-1, 1)
      .set({
        autoplay: true,
        muted: true,
        stream: await nn.askFor({
          video: true
        })
      })

    canvas = nn.create('canvas')
      .position(20, 20)
      .addTo('body')

    canvas.lineWidth = 4
    canvas.fillStyle = 'transparent'
    canvas.strokeStyle = 'white'

    const type = handPoseDetection.SupportedModels.MediaPipeHands
    const config = {
      runtime: 'mediapipe',
      solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
      modelType: 'full',
      maxHands: 1
    }

    model = await handPoseDetection.createDetector(type, config)
   this.remove()
    update()
  }

  nn.create('button')
    .content('Enter Zen Garden')
    .addTo('body')
    .on('click', setup)
</script>
